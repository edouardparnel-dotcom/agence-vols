<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mon agence de vols</title>
<style>
:root { --fond: #f4f6fb; --carte: #fff; --texte: #1b2333; --doux: #5d6b82; }
@media (prefers-color-scheme: dark) { :root { --fond: #0f1520; --carte: #182131; --texte: #e8edf6; --doux: #9aa7bd; } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, "Segoe UI", sans-serif; background: var(--fond); color: var(--texte); padding: 16px; box-sizing: border-box; }
.boite { background: var(--carte); border-radius: 16px; padding: 28px; max-width: 420px; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
h1 { margin: 0 0 8px; font-size: 22px; }
p { color: var(--doux); margin: 8px 0; }
a.bouton { display: inline-block; margin-top: 12px; padding: 12px 24px; border-radius: 10px; background: #ff7a00; color: #fff; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<div class="boite">
  <h1>✈️ Mon agence de vols</h1>
  <p id="etat">Ouverture de l'agence…</p>
</div>
<script>
// L'adresse du moteur change à chaque démarrage du PC : elle est lue ici, puis on y redirige.
const etat = document.getElementById('etat');
fetch('https://api.github.com/repos/edouardparnel-dotcom/agence-vols/contents/adresse.json', {
  headers: { Accept: 'application/vnd.github.raw+json' }, cache: 'no-store',
})
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(({ adresse, ouverte }) => {
    if (!ouverte || !/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(adresse)) {
      etat.textContent = 'L\'agence est fermée pour le moment (l\'ordinateur de Parnel est éteint). Réessayez plus tard.';
      return;
    }
    etat.innerHTML = `Redirection… <br><a class="bouton" href="${adresse}">Ouvrir l'agence</a>`;
    location.replace(adresse);
  })
  .catch(() => { etat.textContent = 'Impossible de joindre l\'agence pour le moment. Réessayez dans quelques minutes.'; });
</script>
</body>
</html>
